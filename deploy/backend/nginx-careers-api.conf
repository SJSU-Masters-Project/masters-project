# One-time setup: paste this inside the existing HTTPS `server { ... }` block for
# careers.myacademic.org, ABOVE any SPA fallback (`location / { try_files ... }`), then run:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The API then shares the site's origin (https://careers.myacademic.org/api/), so the browser
# needs no CORS and Clerk's token "azp" is the site itself.
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    # The API caps resumes at 5 MB; nginx's default limit is 1 MB.
    client_max_body_size 6m;
}
