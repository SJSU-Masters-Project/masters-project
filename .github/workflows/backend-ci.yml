name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - "requirements*.txt"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "requirements*.txt"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG: "true"
      CAREERS_DEV_AUTH: "true"
      DJANGO_SECRET_KEY: ci-only
      MONGODB_URI: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check backend --config backend/ruff.toml

      - name: Ruff format check
        run: ruff format --check backend --config backend/ruff.toml

      - name: Django system checks
        working-directory: backend
        run: python manage.py check

      - name: OpenAPI schema validation
        working-directory: backend
        run: python manage.py spectacular --validate --fail-on-warn --file schema.yml

      - name: Pytest
        working-directory: backend
        run: pytest
