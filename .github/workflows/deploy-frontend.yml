name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Vite bakes VITE_* values into the bundle at build time, so they are set here, not on
      # the server. Both are public (they end up in the browser), so they are repository
      # variables, not secrets.
      - name: Check production build settings
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || (vars.CAREERS_HOST && format('https://{0}/api', vars.CAREERS_HOST)) }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          fail=0
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Set the CAREERS_HOST repository variable (e.g. careers.myacademic.org) or VITE_API_URL."
            fail=1
          fi
          case "$VITE_CLERK_PUBLISHABLE_KEY" in
            pk_live_*) ;;
            "")
              echo "::error::Set the VITE_CLERK_PUBLISHABLE_KEY repository variable to the Clerk production instance's pk_live_ key."
              fail=1 ;;
            *)
              echo "::error::VITE_CLERK_PUBLISHABLE_KEY is not a production key (expected pk_live_...). Development keys must not ship to prod."
              fail=1 ;;
          esac
          exit "$fail"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || (vars.CAREERS_HOST && format('https://{0}/api', vars.CAREERS_HOST)) }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts

      - name: Upload frontend files
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/careers-dist/

      - name: Deploy files on EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'sudo mkdir -p /var/www/careers.myacademic.org &&
             sudo rsync -az --delete /tmp/careers-dist/ /var/www/careers.myacademic.org/ &&
             sudo chown -R nginx:nginx /var/www/careers.myacademic.org &&
             sudo chmod -R 755 /var/www/careers.myacademic.org &&
             sudo nginx -t &&
             sudo systemctl reload nginx'
