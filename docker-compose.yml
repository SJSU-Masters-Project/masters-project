services:
  mongo:
    image: mongo:8.0
    container_name: careers-mongo
    environment:
      # Lets MongoDB 8.0 start on Linux kernels 6.19 to 7.0.13 (SERVER-121912); harmless elsewhere.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
